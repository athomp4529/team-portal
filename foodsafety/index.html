<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training Dashboard · Ft. Totten</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>@font-face{font-family:Apercu;src:url(../assets/fonts/Apercu-Regular.otf) format("opentype");font-weight:400}
@font-face{font-family:Apercu;src:url(../assets/fonts/Apercu-Bold.otf) format("opentype");font-weight:700}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FCF7E7;color:#1A1A1A;font-family:Apercu,Arial,sans-serif;padding:24px;box-sizing:border-box}
.card{background:#fff;border:1px solid #EEEDEB;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:40px 32px;max-width:420px;width:100%;display:grid;gap:16px;justify-items:center;text-align:center;box-sizing:border-box}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#5B6770}h1{margin:0;font-size:24px;color:#DD0033;letter-spacing:-.02em}p{margin:0;line-height:1.5;color:#5B6770;font-size:14px}a{color:#DD0033}a:hover{color:#940929}#err{color:#DD0033}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:999px;border:2px solid #DD0033;background:#DD0033;color:#fff;font:700 16px Apercu,Arial,sans-serif;text-decoration:none;cursor:pointer;width:100%;box-sizing:border-box;transition:background .16s,border-color .16s}.btn:hover{background:#940929;border-color:#940929}.btn:active{transform:scale(.97)}
.link{font:400 14px Apercu,Arial,sans-serif;color:#1A1A1A;background:#fff;border:2px solid #DAD7D2;border-radius:10px;padding:12px;width:100%;box-sizing:border-box;text-align:center}.link:focus{outline:none;border-color:#3EB1C8}
.steps{margin:0;padding:16px 16px 16px 36px;text-align:left;background:#FCF7E7;border-radius:10px;color:#1A1A1A;font-size:15px;line-height:1.6;width:100%;box-sizing:border-box}
#inapp{display:none;gap:12px;width:100%}.small{font-size:13px}</style></head>
<body><div class="card">
  <div class="eyebrow">Chick-fil-A Ft. Totten</div>
  <h1>Training Dashboard</h1>
  <p>Leaders only. Sign in with your cfafttotten.com Google account.</p>
  <div id="btn" style="min-height:44px"></div>
  <div id="inapp">
    <p style="color:#1A1A1A">Sign-in button not working? Open this page in your phone’s browser.</p>
    <button class="btn" id="copy" type="button">Copy Link</button>
    <input class="link" id="link" readonly onclick="this.select()">
    <ol class="steps" id="steps"></ol>
    <p class="small">Tip: once it opens, use Share ▸ Add to Home Screen so you can skip this next time.</p>
  </div>
  <p id="err"></p>
</div>
<script>
var err = document.getElementById('err');
var ua = navigator.userAgent || '', inBrowser = /[?&]browser=1/.test(location.search);
var url = 'https://team.cfafttotten.com/foodsafety/leaders/?browser=1';
var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var isAndroid = /Android/.test(ua);
var box = document.getElementById('inapp'), field = document.getElementById('link');
function showCopy() {
  var steps = document.getElementById('steps');
  box.style.display = 'grid';
  field.value = url;
  var browser = isAndroid ? 'Chrome' : isIOS ? 'Safari' : 'your browser';
  steps.innerHTML = '<li>Tap <b>Copy Link</b> above.</li><li>Open <b>' + browser + '</b> and paste the link in the address bar.</li><li>Sign in with your cfafttotten.com account.</li>';
  document.getElementById('copy').onclick = function () {
    var b = this;
    function done(){ b.textContent = 'Link Copied'; setTimeout(function(){ b.textContent = 'Copy Link'; }, 2000); }
    function fallback(){ field.focus(); field.select(); field.setSelectionRange(0, url.length); try { if (document.execCommand('copy')) return done(); } catch (e) {} prompt('Copy this link:', url); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done, fallback); else fallback();
  };
}
if (!inBrowser) showCopy();
function fail(t){ err.textContent = t; }
function ready(cb){ if (window.google && google.accounts) cb(); else setTimeout(function(){ ready(cb); }, 100); }
fetch('../config.json', { cache: 'no-store' })
  .then(function (r) { if (!r.ok) throw new Error('config.json was not found (status ' + r.status + ').'); return r.text(); })
  .then(function (t) {
    var c; try { c = JSON.parse(t); } catch (e) { throw new Error('config.json has a typo: ' + e.message); }
    if (!c.dashboardUrl || /PASTE/.test(c.dashboardUrl)) throw new Error('config.json does not have a dashboardUrl yet.');
    if (!c.googleClientId || /PASTE/.test(c.googleClientId)) throw new Error('config.json does not have a googleClientId yet.');
    ready(function () {
      google.accounts.id.initialize({
        client_id: c.googleClientId, hd: 'cfafttotten.com', auto_select: true,
        callback: function (res) { location.replace(c.dashboardUrl + (c.dashboardUrl.indexOf('?') < 0 ? '?' : '&') + 't=' + encodeURIComponent(res.credential)); }
      });
      google.accounts.id.renderButton(document.getElementById('btn'), { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with' });
      google.accounts.id.prompt();
    });
  })
  .catch(function (e) { fail('Could not start sign-in. ' + e.message); });
</script></body></html>

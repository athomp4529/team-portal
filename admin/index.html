<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Member Records · Ft. Totten</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FCF7E7;color:#1A1A1A;font-family:Arial,sans-serif}a{color:#DD0033}</style></head>
<body><p id="m">Opening Team Member Records…</p>
<script>
fetch('../config.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(c){
  if(c.adminUrl && !/PASTE/.test(c.adminUrl)) location.replace(c.adminUrl);
  else document.getElementById('m').textContent='The admin link has not been set up yet.';
}).catch(function(){document.getElementById('m').textContent='Could not load settings.';});
</script></body></html>
